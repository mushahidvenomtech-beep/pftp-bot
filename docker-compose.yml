services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pftp_chatbot_app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pftp_chatbot
      - DB_USER=pftp_user
      - DB_PASS=pftp_password
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: pftp_chatbot_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret
      - MYSQL_DATABASE=pftp_chatbot
      - MYSQL_USER=pftp_user
      - MYSQL_PASSWORD=pftp_password
    volumes:
      - pftp_db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  pftp_db_data:

